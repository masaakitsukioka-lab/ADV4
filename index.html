function drawScene(roomId){
 const ctx=$('pixelScene').getContext('2d');ctx.imageSmoothingEnabled=false;

const state={mode:'exploration',room:SCENARIO.initial.room,flags:{...SCENARIO.initial.flags},inventory:[],visits:{[SCENARIO.initial.room]:1},completedEvents:{},selected:null,dialogue:[],lineIndex:0,afterDialogue:null,deductionStep:0,errors:0};

$('autoButton').onclick=e=>{e.stopPropagation();textSettings.auto=!textSettings.auto;updateTextControls();scheduleAuto()};
function scheduleAuto(){clearTimeout(autoTimer);if(textSettings.auto&&typingDone&&state.mode==='dialogue'&&!choicesPending&&!$('dialogueChoices').children.length)autoTimer=setTimeout(advance,1350)};updateTextControls();
function render(){ $('location').textContent=room().name;$('scene').className=state.room==='corridor'?'corridor':''; drawScene(state.room);setSceneBackground(state.room);$('targets').innerHTML='';room().targets.forEach(t=>{const b=document.createElement('button');b.className='target'+(state.selected===t.id?' selected':'');b.dataset.id=t.id;b.textContent=t.name;placeTarget(b,t.id);b.addEventListener('click',e=>{e.stopPropagation();if(state.mode!=='exploration')return;state.selected=t.id;render();showActions(t.id)});$('targets').appendChild(b)});const explore=state.mode==='exploration';$('move').classList.toggle('hidden',!explore);$('menu').classList.toggle('hidden',!explore);if(!state.selected||!explore)$('actions').classList.add('hidden')}
function showActions(id){const a=$('actions');a.innerHTML='';const b=document.querySelector('[data-id="'+id+'"]');for(const action of ['しらべる',...(id==='shelf'&&state.inventory.length?['しょうこをみせる']:[])]){const x=document.createElement('button');x.textContent=action;x.onclick=()=>action==='しらべる'?examine(id):showEvidence();a.appendChild(x)}a.classList.remove('hidden');const g=$('game').getBoundingClientRect(),r=b.getBoundingClientRect();a.style.left=Math.max(52,Math.min(r.left-g.left,g.width-a.offsetWidth-52))+'px';a.style.top=Math.max(8,Math.min(r.bottom-g.top+8,g.height-a.offsetHeight-8))+'px'}
function say(lines,after=null){cancelTextTimers();state.mode='dialogue';state.dialogue=lines;state.lineIndex=0;state.afterDialogue=after;state.selected=null;$('panel').classList.add('hidden');$('actions').classList.add('hidden');$('dialogue').classList.remove('hidden');$('portraitRail').classList.remove('hidden');$('characterStage').classList.remove('hidden');$('textControls').classList.remove('hidden');const generation=++dialogueGeneration;requestAnimationFrame(()=>{if(generation===dialogueGeneration&&state.mode==='dialogue')$('dialogue').classList.add('open')});displayLine();render()}
function displayLine(){cancelTextTimers();const v=state.dialogue[state.lineIndex];if(!v)return;const speaker=v[0],full=String(v[1]);$('speaker').textContent=speaker;$('line').textContent='';$('nextMark').classList.remove('ready');$('dialogueChoices').replaceChildren();$('harukiFace').classList.toggle('active',speaker==='ハルキ');$('saijiFace').classList.toggle('active',speaker==='サイジ');updateCharacterCards(speaker,v[2]||'通常');typingDone=false;displayedChars=0;const chars=Array.from(full);const speed=textSettings.speeds[textSettings.index];function tick(){if(state.mode!=='dialogue')return;displayedChars=Math.min(chars.length,displayedChars+1);$('line').textContent=chars.slice(0,displayedChars).join('');if(displayedChars<chars.length){typingTimer=setTimeout(tick,speed)}else{typingDone=true;$('nextMark').classList.add('ready');onLineCompleted();scheduleAuto()}}if(speed===0||matchMedia('(prefers-reduced-motion: reduce)').matches){$('line').textContent=full;displayedChars=chars.length;typingDone=true;$('nextMark').classList.add('ready');onLineCompleted();scheduleAuto()}else tick()}
function onLineCompleted(){}
function advance(){if(state.mode!=='dialogue')return;if(choicesPending)return;if(!typingDone){cancelTextTimers();$('line').textContent=state.dialogue[state.lineIndex][1];typingDone=true;$('nextMark').classList.add('ready');onLineCompleted();scheduleAuto();return}cancelTextTimers();state.lineIndex++;if(state.lineIndex>=state.dialogue.length){closeDialogueLayer();state.mode='exploration';const next=state.afterDialogue;state.afterDialogue=null;if(next)next();else render()}else displayLine()}
const Events=window.SaikachiEvents;
function runEvent(event){
 if(!event||!Events.apply(event,state))return false;
 const finish=()=>{
  if(event.topic){playTopic(event.topic);return}
  if(event.next){playTopic(event.next);return}
  if(event.choices){showTopicChoices(event.choices);return}
  closeDialogueLayer();state.mode='exploration';render();
 };
 if(event.lines&&event.lines.length)say(event.lines,finish);else finish();
 return true;
}
function examine(id){
 if(state.mode!=='exploration')return;
 runEvent(Events.select(SCENARIO.investigations[id]||[],state));
}
function moveTo(id){
 if(!DATA.rooms[id])return;
 const changed=Events.enter(id,state);closePanel();
 if(changed)runEvent(Events.select(DATA.rooms[id].onEnter||[],state));
}
let panelRevision=0;
function panel(title,buttons){panelRevision++;state.mode='menu';state.selected=null;render();$('panelTitle').textContent=title;const body=$('panelBody');body.innerHTML='';buttons.forEach(([label,fn])=>{const b=document.createElement('button');b.textContent=label;b.onclick=fn;body.appendChild(b)});$('panel').classList.remove('hidden')}
function closePanel(){panelRevision++;state.mode='exploration';$('panel').classList.add('hidden');render()}
// 工程18: 保存はメニューから手動で行い、復帰は探索状態に統一する。
const Saves=window.SaikachiSaves.create(SCENARIO,()=>window.localStorage);
function saveMessage(message,back=menu){
 panel('セーブ・ロード',[['もどる',back]]);
 const note=document.createElement('p');note.textContent=message;$('panelBody').appendChild(note);
}
function saveSlots(action){
 const buttons=[];
 try{
  for(let slot=1;slot<=3;slot++){
   const raw=Saves.raw(slot);let label='空き';
   if(raw!==null){try{const saved=Saves.decode(raw);label=DATA.rooms[saved.progress.room].name+' / '+new Date(saved.savedAt).toLocaleString('ja-JP')}catch(e){label='読み込めないデータ'}}
   buttons.push(['記録'+slot+'：'+label,()=>selectSaveSlot(action,slot)]);
  }
 }catch(e){saveMessage(e.message);return}
 buttons.push(['もどる',menu]);panel(action==='save'?'セーブ':'ロード',buttons);
 const note=document.createElement('p');note.textContent='このブラウザに保存します。別端末へ移すときは「セーブの持ち運び」を使ってください。';$('panelBody').appendChild(note);
}
function selectSaveSlot(action,slot){
 const back=()=>saveSlots(action);
 try{
  if(action==='save'){
   const snapshot=Saves.snapshot(state,textSettings);
   const save=()=>{try{Saves.write(slot,snapshot);saveMessage('記録'+slot+'に保存しました。',back)}catch(e){saveMessage(e.message,back)}};
   if(Saves.raw(slot)!==null)panel('記録'+slot+'を上書きしますか？',[['上書きする',save],['やめる',back]]);else save();
  }else{
   const saved=Saves.read(slot);
   if(!saved){saveMessage('この記録にはまだ保存されていません。',back);return}
   panel('記録'+slot+'から再開しますか？',[['再開する',()=>restoreSave(saved)],['やめる',back]]);
   const note=document.createElement('p');note.textContent='現在の未保存の進行は失われます。';$('panelBody').appendChild(note);
  }
 }catch(e){saveMessage(e.message,back)}
}
function restoreSave(saved){panelRevision++;
 let checked;try{checked=Saves.validate(saved)}catch(e){saveMessage(e.message);return}
 // 検証を完了してから置換。入室イベントや訪問回数更新は呼び出さない。
 closeDialogueLayer();choicesPending=false;typingDone=false;displayedChars=0;
 $('dialogueChoices').replaceChildren();$('nextMark').classList.remove('ready');
 Object.assign(state,checked.progress,{mode:'exploration',selected:null,dialogue:[],lineIndex:0,
  afterDialogue:null,deductionStep:0,errors:0});
 textSettings.index=checked.settings.textSpeed;textSettings.auto=checked.settings.auto;
 updateTextControls();$('panel').classList.add('hidden');$('actions').classList.add('hidden');render();
}

// 工程19: ファイルは端末内で処理し、検証済みの1記録だけを受け渡す。
function transferMenu(){
 panel('セーブの持ち運び',[
  ['今の進行を書き出す',()=>exportProgress()],
  ['保存済みの記録を書き出す',exportSlots],
  ['ファイルを読み込む',importPicker],['もどる',menu]
 ]);
 const note=document.createElement('p');note.textContent='JSONファイルとして保管できます。読み込み後に保存枠を選び、ロードから再開してください。';$('panelBody').appendChild(note);
}
function exportSlots(){
 const buttons=[];
 try{
  for(let slot=1;slot<=3;slot++){
   const value=Saves.raw(slot);let label='空き';
   if(value!==null){try{const saved=Saves.decode(value);label=DATA.rooms[saved.progress.room].name+' / '+new Date(saved.savedAt).toLocaleString('ja-JP')}catch(e){label='読み込めないデータ'}}
   buttons.push(['記録'+slot+'：'+label,()=>exportProgress(slot)]);
  }
 }catch(e){saveMessage(e.message,transferMenu);return}
 buttons.push(['もどる',transferMenu]);panel('書き出す記録',buttons);
}
function exportProgress(slot){
 let url=null,link=null;
 try{
  const saved=slot===undefined?Saves.snapshot(state,textSettings):Saves.read(slot);
  if(!saved){saveMessage('この記録にはまだ保存されていません。',exportSlots);return}
  const checked=Saves.validate(saved);
  const blob=new Blob([JSON.stringify(checked,null,2)+'\n'],{type:'application/json;charset=utf-8'});
  url=URL.createObjectURL(blob);link=document.createElement('a');link.href=url;
  link.download='saikachi-save-'+(slot===undefined?'current':'slot'+slot)+'-'+checked.savedAt.replace(/[^0-9]/g,'')+'.json';
  document.body.appendChild(link);link.click();
  const release=url;setTimeout(()=>URL.revokeObjectURL(release),60000);url=null;
  saveMessage('ファイルの書き出しをブラウザに依頼しました。ダウンロード先にJSONファイルがあるか確認してください。',transferMenu);
 }catch(e){saveMessage('書き出せませんでした。'+e.message,transferMenu)}
 finally{if(link)link.remove();if(url)URL.revokeObjectURL(url)}
}
function importPicker(){
 panel('ファイルを読み込む',[['もどる',transferMenu]]);
 const label=document.createElement('label');label.textContent='セーブのJSONファイルを選択（1MBまで）';
 const input=document.createElement('input');input.type='file';input.accept='.json,application/json';
 input.style.maxWidth='100%';input.style.display='block';input.style.marginTop='12px';
 input.onchange=()=>{const file=input.files&&input.files[0];input.value='';if(file)readSaveFile(file)};
 label.appendChild(input);$('panelBody').appendChild(label);
}
async function readSaveFile(file){
 panel('ファイルを確認しています',[['やめる',transferMenu]]);
 const request=panelRevision;
 try{
  if(file.size>1024*1024)throw new Error('ファイルが大きすぎます。1MB以下のセーブを選んでください。');
  const text=await file.text();
  if(request!==panelRevision)return;
  if(text.length>1024*1024)throw new Error('ファイルが大きすぎます。');
  const saved=Saves.decode(text.replace(/^\uFEFF/,''));
  importPreview(saved);
 }catch(e){if(request===panelRevision)saveMessage('読み込めませんでした。'+e.message,importPicker)}
}
function importPreview(saved){
 // ボタンの操作で枠を確定するまでは、進行も保存領域も変更しない。
 const checked=Saves.validate(saved);
 const buttons=[];
 try{
  for(let slot=1;slot<=3;slot++){
   const exists=Saves.raw(slot)!==null;
   buttons.push(['記録'+slot+'に保存（'+(exists?'記録あり':'空き')+'）',()=>confirmImport(checked,slot)]);
  }
 }catch(e){saveMessage(e.message,transferMenu);return}
 buttons.push(['やめる',transferMenu]);panel('読み込む記録の確認',buttons);
 const note=document.createElement('p');note.textContent='場所：'+DATA.rooms[checked.progress.room].name+' / 保存日時：'+new Date(checked.savedAt).toLocaleString('ja-JP')+' / 持ち物：'+checked.progress.inventory.length+'点。現在のプレイは変更しません。';$('panelBody').appendChild(note);
}
function confirmImport(saved,slot){
 try{
  const exists=Saves.raw(slot)!==null;
  panel('記録'+slot+'に'+(exists?'上書き':'保存')+'しますか？',[
   [exists?'上書きする':'保存する',()=>{
    try{Saves.write(slot,saved);saveMessage('記録'+slot+'に取り込みました。「ロード」から再開できます。',transferMenu)}catch(e){saveMessage(e.message,transferMenu)}
   }],['やめる',()=>importPreview(saved)]
  ]);
 }catch(e){saveMessage(e.message,transferMenu)}
}

function menu(){panel('メニュー', [['セーブ',()=>saveSlots('save')],['ロード',()=>saveSlots('load')],['セーブの持ち運び',transferMenu],['もちもの',inventory],['ちょうさメモ',memo],['人物相関図（次工程）',()=>panel('人物相関図',['もどる'].map(x=>[x,menu]))],['メール（次工程）',()=>panel('メール',[['もどる',menu]])],['操作方法',()=>panel('操作方法',[['対象をタップ → しらべる',()=>{}],['証拠取得後：作品棚 → しょうこをみせる',()=>{}],['もどる',menu]])]])}
function inventory(){panel('もちもの',state.inventory.length?state.inventory.map(item=>[item,()=>panel(item,[['整理票の一部。作品整理が行われたことを示している。',()=>{}],['もどる',inventory]])]).concat([['もどる',menu]]):[['まだ何も持っていない',()=>{}],['もどる',menu]])}
function memo(){panel('ちょうさメモ',[['作品棚：'+(state.flags.shelfChecked?'空きがある':'未調査'),()=>{}],['掲示板：'+(state.flags.noticeChecked?'作品整理日の掲示':'未調査'),()=>{}],['整理票：'+(state.flags.foundClue?'発見済み':'未発見'),()=>{}],['推理：'+(state.flags.deductionDone?'完了':'未解決'),()=>{}],['もどる',menu]])}
function showEvidence(){if(!state.inventory.length)return say([['ハルキ','見せられる証拠を持っていない。']]);panel('しょうこをみせる',state.inventory.map(item=>[item,()=>{closePanel();if(item==='整理票の切れ端'&&state.flags.noticeChecked){say([['ハルキ','整理票の切れ端と、掲示板の日付が一致する。'],['サイジ','ならば、ここから考えてみよう。']],startDeduction)}else say([['サイジ','今はこの証拠ではないようだ。']])}]).concat([['もどる',closePanel]]))}
const questions=SCENARIO.questions;
function startDeduction(){state.deductionStep=0;state.errors=0;deduction()}
function deduction(){state.mode='deduction';render();$('panel').classList.remove('hidden');$('panelTitle').textContent='推理：ハルキ × サイジ';const q=questions[state.deductionStep],body=$('panelBody');body.innerHTML='';const heading=document.createElement('p');heading.textContent='サイジ「'+q.q+'」';body.appendChild(heading);q.opts.forEach((option,i)=>{const b=document.createElement('button');b.className='deduction-choice';b.textContent=(i+1)+'. '+option;b.onclick=()=>{if(i!==q.correct){state.errors++;heading.textContent='サイジ「その答えでは説明がつかない。もう一度考えよう。」'+(state.errors>=2?' ヒント：作品整理の記録に注目。':'');return}state.deductionStep++;if(state.deductionStep<questions.length)deduction();else{Events.apply({set:{deductionDone:true}},state);$('panel').classList.add('hidden');say([['ハルキ','作品が移動された可能性が高いんだね。'],['サイジ','ああ。ただし、これで紛失の真相が確定したわけじゃない。'],['ハルキ','試遊版の推理はここまで。']],null)}};body.appendChild(b)});const back=document.createElement('button');back.textContent='探索にもどる';back.onclick=closePanel;body.appendChild(back)}

// v0.4: data-driven dialogue choices; placeholder portraits (not final character art)
let choicesPending=false;
const CHARACTER_EMOTIONS={ 'ハルキ':['通常','驚き','困惑','納得'], 'サイジ':['通常','思案','疑問','確信'] };
function updateCharacterCards(speaker,emotion){
  for(const [name,id] of [['ハルキ','haruki'],['サイジ','saiji']]){
    $(id+'Card').classList.toggle('active',name===speaker);
    const shown=CHARACTER_EMOTIONS[name].includes(emotion)?emotion:'通常';$(id+'Emotion').textContent=shown;setCharacterImage(id,shown);
  }
}
const TOPIC_DIALOGUE=SCENARIO.topics;
function startTopicDialogue(){playTopic('intro')}
function playTopic(id){
 choicesPending=false;
 if(!runEvent(TOPIC_DIALOGUE[id])){closeDialogueLayer();state.mode='exploration';render()}
}
function showTopicChoices(choices){
  cancelTextTimers();
  choices=choices.filter(option=>Events.available(option,state));
  if(!choices.length){choicesPending=false;closeDialogueLayer();state.mode='exploration';render();return}
  // Choice UI belongs to the dialogue layer, not the exploration/menu overlay.
  choicesPending=true;state.mode='dialogue';state.afterDialogue=null;
  $('dialogue').classList.remove('hidden');$('dialogue').classList.add('open');
  $('characterStage').classList.remove('hidden');$('portraitRail').classList.remove('hidden');
  $('textControls').classList.remove('hidden');
  $('speaker').textContent='サイジ';$('line').textContent='どうする？';$('nextMark').classList.remove('ready');
  updateCharacterCards('サイジ','疑問');
  const container=$('dialogueChoices');container.replaceChildren();
  for(const option of choices){const b=document.createElement('button');b.type='button';b.textContent=option.label;b.onclick=e=>{e.stopPropagation();choicesPending=false;container.replaceChildren();runEvent(option)};container.appendChild(b)}
  render();
}

$('move').onclick=()=>panel('いどう',Object.entries(DATA.rooms).map(([id,r])=>[r.name,()=>moveTo(id)]));$('menu').onclick=menu;$('close').onclick=closePanel;$('dialogue').onclick=e=>{if(e.target.closest('button'))return;advance()};$('game').addEventListener('click',e=>{if(e.target===$('scene')||e.target===$('pixelScene')||e.target===$('targets')||e.target.classList.contains('grain')){state.selected=null;$('actions').classList.add('hidden');render()}});window.addEventListener('resize',()=>{if(state.mode==='exploration'){render();if(state.selected)showActions(state.selected)}else{drawScene(state.room);setSceneBackground(state.room)}});document.addEventListener('keydown',e=>{if(e.isComposing)return;if((e.key==='Enter'||e.key===' ')&&state.mode==='dialogue'){if(e.target?.closest('button, input, textarea, select, [contenteditable]'))return;if(choicesPending)return;e.preventDefault();if(!e.repeat)advance()}else if(e.key==='Escape'&&['menu','deduction'].includes(state.mode))closePanel()});render();
</script></body></html>
